[project]
name = "lance-namespace-workspace"
version = "0.7.6"
description = "Lance Namespace workspace with all Python packages"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "openapi-spec-validator==0.7.1",
    "openapi-generator-cli==7.12.0",
    "mkdocs-material",
    "mkdocs-linkcheck",
    "mkdocs-macros-plugin",
    "mkdocs-awesome-pages-plugin",
    "jsf>=0.7.0",
    "prance>=23.0.0",
    "jsonpath-ng>=1.6.0",
    "schemathesis>=3.30.0",
    # CTS contract-test generator templates (ci/cts/gen_wiremock_tests.py).
    # chevron is a pure-Python Mustache renderer used to mirror the
    # openapi-generator template-driven codegen pattern.
    "chevron>=0.14.0",
    # CTS behavioural-contract loader / linter (ci/cts/lint_contracts.py,
    # ci/cts/contract_loader.py).  Both `pyyaml` and `jsonschema` happen to
    # be transitively installed today (via schemathesis / openapi tooling)
    # but we declare them explicitly so the lint can run on a minimal env.
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[tool.uv.workspace]
members = [
    "python/lance_namespace_urllib3_client",
    "python/lance_namespace",
]

[tool.uv.sources]
lance-namespace-urllib3-client = { workspace = true }
lance-namespace = { workspace = true }
