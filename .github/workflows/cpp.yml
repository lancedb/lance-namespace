name: C/C++

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened
    paths:
      - docs/src/spec.yaml
      - cpp/**
      - .github/workflows/cpp.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            full_build: true
          - os: macos-14
            full_build: false
          - os: windows-2022
            full_build: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout lance-namespace repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Build full C/C++ SDK
        if: ${{ matrix.full_build }}
        working-directory: cpp
        run: make build

      - name: Build C/C++ core
        if: ${{ !matrix.full_build }}
        working-directory: cpp
        run: |
          cmake -S lance_namespace -B lance_namespace/build -DCMAKE_BUILD_TYPE=Release
          cmake --build lance_namespace/build --parallel 2
          ctest --test-dir lance_namespace/build --output-on-failure --parallel 2
