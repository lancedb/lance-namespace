  # ──────────────────────────────────────────────────────────────────
  # Table Version operations.
  #
  # The Version domain shares table.yaml with the Table-metadata domain
  # because every version op operates on a single table id and depends
  # on the same `Fixtures::create_table_empty` fixture for happy paths.
  # DirectoryNamespace v6.0.0 implements the read-side ops natively
  # (list / describe / batch_delete) plus `create_table_version`
  # against the staging-manifest path; `BatchCreateTableVersions` is
  # NOT on the v6.0.0 trait at all and the operation block below
  # carries an op-level `skip_reason` so lint coverage is satisfied
  # without forcing a runtime test we cannot drive.
  # ──────────────────────────────────────────────────────────────────
  - operation: ListTableVersions
    requires_capabilities: [supports_table_versioning]
    cases:
      - id: list_versions_on_nonexistent_table_must_404
        description: |
          ListTableVersions on an unknown table surfaces TableNotFound
          (4) at the resolve_table_location step.
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
        then:
          error_code: 4

      - id: list_versions_after_create_returns_v0
        description: |
          A freshly created table has at least its initial version
          listed; the case asserts the call succeeds.
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
        then:
          status: ok

      - id: list_versions_namespace_not_found_must_404
        description: |
          See `ListTables.list_tables_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
        then:
          error_code: 1

  - operation: DescribeTableVersion
