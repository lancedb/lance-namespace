        then:
          error_code: 1

  - operation: BatchCreateTableVersions
    skip_reason: |
      The pinned `lance-namespace = 6.0.0` trait does NOT expose
      `batch_create_table_versions`. The CTS cannot drive it through
      the in-process caller; coverage is opted out at the operation
      level so lint accepts the bundle.  Re-enable this op block
      (and add cases for codes 1, 4, 14) once the trait gains the
      method and the pin moves forward.
    cases: []

