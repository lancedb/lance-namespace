      - id: alter_table_add_columns_unknown_table_must_404
        description: |
          On backends that implement column evolution, an unknown
          table id surfaces TableNotFound (4). DirectoryNamespace
          skips via `supports_alter_table_columns`.
        requires_capabilities: [supports_alter_table_columns]
        given:
          state: empty_catalog
