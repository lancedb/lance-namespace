  - operation: CreateTableVersion
    requires_capabilities: [supports_table_versioning]
    cases:
      - id: create_version_on_nonexistent_table_must_404
        description: |
          CreateTableVersion on an unknown table id surfaces
          TableNotFound (4) at resolve_table_location, before any
          object-store IO is attempted.
        given:
