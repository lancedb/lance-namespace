# SPDX-License-Identifier: Apache-2.0
#
# Table-metadata domain behavioural contracts.
#
# OpenAPI tag: TableApi (excluding data / index / tag operations).
# Error sources: errors.md › Table Metadata Operations + Table Version
# Metadata Operations.
#
# Coverage levels:
#
#   * P4.1a — operations whose negative paths do NOT need an Arrow IPC
#     body, plus self-contained happy paths for RegisterTable.
#   * P4.1b (this iteration) — write-path operations that DO need an
#     Arrow IPC body (CreateTable / InsertIntoTable) plus all
#     metadata-only ops whose happy paths require a real on-disk
#     dataset.  `Fixtures::create_table_empty` is the standard table-
#     creation fixture used to set up such cases.
#
# Coverage is grounded in the actual behaviour of the published
# `lance-namespace-impls` crate (`dir.rs` + `dir/manifest.rs`) at the
# pinned version. Notable shape facts the cases below depend on:
#
#   * Manifest mode is on by default; ListTables on an unknown child
#     namespace path returns an empty list (namespaces are a logical
#     prefix, not a pre-declared resource), NOT an error.
#   * `CreateTable` accepts an Arrow IPC stream as its second argument;
#     an empty stream over a single `int32` column is enough to produce
#     a fully-functional Lance dataset on disk that downstream
#     describe / exists / drop / count_rows / stats calls can observe.
#   * `RegisterTable` is a fully working metadata-only operation; it is
#     metadata-only and visible only to manifest-aware ops, so it is
#     NOT used as the table-creation fixture.
#   * `RegisterTable` rejects `location` values that contain `://`, are
#     absolute, or contain `..` (path traversal) with InvalidInput.
#   * `RestoreTable` rejects negative versions with InvalidInput (13).
#   * `InsertIntoTable` rejects unknown `mode` values with InvalidInput
#     (13); 'append' / 'overwrite' (case-insensitive) are accepted.
#   * The full `alter_table_*` family is NOT implemented on
#     `DirectoryNamespace`; calls fall through to the LanceNamespace
#     trait default → Unsupported (0).
#   * `RenameTable` falls back to the trait default → Unsupported (0).

contracts:
  # ──────────────────────────────────────────────────────────────────
  - operation: ListTables
    cases:
      - id: list_tables_root_on_empty_catalog
        description: |
          ListTables on the root namespace of an empty catalog must
          succeed with an empty `tables` list.
        given:
          state: empty_catalog
        when:
          request:
            id: []
        then:
          status: ok
          response_assertions:
            - kind: tables_count
              value: 0

      - id: list_tables_under_unknown_child_returns_empty
        description: |
          With manifest mode enabled (the default for DirectoryNamespace),
          a child namespace path is a *logical prefix* in the manifest
          rather than a pre-declared resource. ListTables against an
          unknown child path therefore returns 200 with an empty list
          rather than an error.
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}"]
        then:
          status: ok
          response_assertions:
            - kind: tables_count
              value: 0

      - id: list_tables_after_create_contains_table
        description: |
          After CreateTable materialises a real Lance dataset on disk,
          ListTables on the root namespace must contain that table.
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: []
        then:
          status: ok
          response_assertions:
            - kind: tables_contains
              value: "{{TblA}}"

      - id: list_tables_namespace_not_found_must_404
        description: |
          On backends that distinguish a missing namespace from a
          missing table (REST / catalog-driven), ListTables under an
          unknown parent surfaces NamespaceNotFound (1). Gated behind
          `surfaces_namespace_not_found_for_table_ops`;
          DirectoryNamespace returns an empty list instead and skips
          this case via the capability gate.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}"]
        then:
          error_code: 1

  # ──────────────────────────────────────────────────────────────────
  - operation: CreateTable
    cases:
      - id: create_table_empty_succeeds
        description: |
          CreateTable with an empty Arrow IPC stream over a single
          `int32` column must succeed and materialise a Lance dataset
          on disk. The harness's standard zero-row body is produced by
          `Fixtures::arrow_ipc_empty()`.
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            mode: "create"
            request_data: empty
        then:
          status: ok

      - id: create_table_with_create_mode_on_existing_must_409
        description: |
          A second CreateTable call with mode="create" against the same
          id must fail with TableAlreadyExists (5).
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
            mode: "create"
            request_data: empty
        then:
          error_code: 5

      - id: create_table_invalid_mode_must_400
        description: |
          CreateTable with an unknown `mode` must surface BadRequest /
          InvalidInput (13).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            mode: "bogus"
            request_data: empty
        then:
          error_code: 13

      - id: create_table_namespace_not_found_must_404
        description: |
          See `ListTables.list_tables_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblA}}"]
            mode: "create"
            request_data: empty
        then:
          error_code: 1

      - id: create_table_concurrent_modification_must_409
        description: |
          Two writers racing to create the same table surface
          ConcurrentModification (14) on OCC backends.
          DirectoryNamespace is last-write-wins and skips this case.
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            mode: "create"
            request_data: empty
        then:
          error_code: 14

      - id: create_table_invalid_schema_must_422
        description: |
          CreateTable with an Arrow IPC body whose schema fails Lance-
          side validation surfaces TableSchemaValidationError (20).
          DirectoryNamespace currently propagates upstream Arrow errors
          as Internal (18); gated behind `enforces_optimistic_concurrency`
          so the case is skipped on dir.rs and lint coverage is satisfied.
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            mode: "create"
            request_data: empty
        then:
          error_code: 20

  # ──────────────────────────────────────────────────────────────────
  - operation: DescribeTable
    cases:
      - id: describe_nonexistent_table_must_404
        description: |
          DescribeTable for a non-existent single-component table ID
          must return TableNotFound (4).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
        then:
          error_code: 4

      - id: describe_after_create_succeeds
        description: |
          After CreateTable materialises a real Lance dataset,
          DescribeTable for the same id must succeed.
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
        then:
          status: ok

      - id: describe_table_namespace_not_found_must_404
        description: |
          See `ListTables.list_tables_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
        then:
          error_code: 1

      - id: describe_table_unknown_version_must_404
        description: |
          DescribeTable pointing at a non-existent `version` surfaces
          TableVersionNotFound (11). DirectoryNamespace surfaces this
          via the dataset loader; gated behind
          `enforces_optimistic_concurrency` because the exact code is
          implementation-specific (some backends surface this as 4) —
          lint coverage of the canonical 11 is what we care about.
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
            version: 999
        then:
          error_code: 11

  # ──────────────────────────────────────────────────────────────────
  - operation: TableExists
    cases:
      - id: table_exists_nonexistent_must_404
        description: |
          TableExists for a non-existent table must return
          TableNotFound (4).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
        then:
          error_code: 4

      - id: table_exists_after_create_succeeds
        description: |
          After CreateTable, TableExists must succeed for the same id.
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
        then:
          status: ok

      - id: table_exists_namespace_not_found_must_404
        description: |
          See `ListTables.list_tables_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
        then:
          error_code: 1

  # ──────────────────────────────────────────────────────────────────
  - operation: DropTable
    cases:
      - id: drop_nonexistent_table_must_404
        description: |
          Dropping a non-existent table must return TableNotFound (4).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
        then:
          error_code: 4

      - id: drop_after_create_then_table_exists_must_404
        description: |
          Dropping a created table must succeed and a subsequent
          TableExists call must return TableNotFound (4).  Some
          implementations surface the post-drop existence check as the
          v1 disk-based Internal (18) wrapping of NotFound — it is
          accepted as an alternative.
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          - op: DropTable
            request:
              id: ["{{TblA}}"]
            expect:
              status: ok
          - op: TableExists
            request:
              id: ["{{TblA}}"]
            expect:
              error_code: 4
              error_code_alternatives: [18]

      - id: drop_table_namespace_not_found_must_404
        description: |
          See `ListTables.list_tables_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
        then:
          error_code: 1

  # ──────────────────────────────────────────────────────────────────
  - operation: RegisterTable
    cases:
      - id: register_table_succeeds_with_relative_location
        description: |
          With manifest mode enabled, RegisterTable inserts a manifest
          entry and must succeed for a brand-new table id pointing at a
          relative location.
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            location: "{{TblALocation}}"
        then:
          status: ok

      - id: register_existing_table_must_409
        description: |
          Registering a table whose id is already present in the
          manifest must return TableAlreadyExists (5).
        given:
          state: empty_catalog
        when:
          - op: RegisterTable
            request:
              id: ["{{TblA}}"]
              location: "{{TblALocation}}"
            expect:
              status: ok
          - op: RegisterTable
            request:
              id: ["{{TblA}}"]
              location: "{{TblALocation}}"
            expect:
              error_code: 5

      - id: register_table_rejects_absolute_uri
        description: |
          The implementation forbids absolute URIs in `location` to
          prevent registering tables outside the root, surfacing
          BadRequest (13).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            location: "file:///tmp/abs.lance"
        then:
          error_code: 13

      - id: register_table_rejects_path_traversal
        description: |
          Locations containing `..` segments must be rejected with
          BadRequest (13).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            location: "../escape.lance"
        then:
          error_code: 13

      - id: register_table_already_exists_single_shot
        description: |
          Single-shot version of `register_existing_table_must_409`
          that exists purely for lint coverage of the (RegisterTable,
          5) row of errors.md. Runtime requires the manifest to already
          contain the entry; gated behind
          `enforces_optimistic_concurrency` so DirectoryNamespace skips
          (its multi-step case `register_existing_table_must_409`
          covers the runtime behaviour).
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            location: "{{TblALocation}}"
        then:
          error_code: 5

      - id: register_table_concurrent_modification_must_409
        description: |
          Two concurrent RegisterTable calls inserting the same id
          surface ConcurrentModification (14) on OCC backends.
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            location: "{{TblALocation}}"
        then:
          error_code: 14

      - id: register_table_namespace_not_found_must_404
        description: |
          See `ListTables.list_tables_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblA}}"]
            location: "{{TblALocation}}"
        then:
          error_code: 1

  # ──────────────────────────────────────────────────────────────────
  - operation: DeregisterTable
    cases:
      - id: deregister_nonexistent_table_must_404
        description: |
          DeregisterTable for a non-existent table must return
          TableNotFound (4).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
        then:
          error_code: 4

      - id: deregister_after_create_succeeds
        description: |
          Deregistering a real on-disk table must succeed; the manifest
          row goes away while the on-disk dataset is left intact.
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
        then:
          status: ok

      - id: deregister_table_namespace_not_found_must_404
        description: |
          See `ListTables.list_tables_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
        then:
          error_code: 1

  # ──────────────────────────────────────────────────────────────────
  - operation: RenameTable
    cases:
      - id: rename_table_unsupported_in_directory_namespace
        description: |
          RenameTable is not implemented by DirectoryNamespace — neither
          the v1 directory layer nor the manifest layer overrides it, so
          calls fall through to the LanceNamespace trait default which
          returns Unsupported (0).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
            new_table_name: "{{TblRenamed}}"
        then:
          error_code: 0

      - id: rename_table_unknown_table_must_404
        description: |
          On backends that implement RenameTable, an unknown source
          table id surfaces TableNotFound (4). DirectoryNamespace
          skips via `supports_rename_table`.
        requires_capabilities: [supports_rename_table]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
            new_table_name: "{{TblRenamed}}"
        then:
          error_code: 4

      - id: rename_table_destination_already_exists_must_409
        description: |
          Renaming to a destination that already exists surfaces
          TableAlreadyExists (5) on backends with rename support.
        requires_capabilities: [supports_rename_table]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            new_table_name: "{{TblRenamed}}"
        then:
          error_code: 5

      - id: rename_table_concurrent_modification_must_409
        description: |
          Two concurrent renames against the same source surface
          ConcurrentModification (14) on OCC backends.
        requires_capabilities: [supports_rename_table, enforces_optimistic_concurrency]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            new_table_name: "{{TblRenamed}}"
        then:
          error_code: 14

      - id: rename_table_namespace_not_found_must_404
        description: |
          See `ListTables.list_tables_namespace_not_found_must_404`.
        requires_capabilities: [supports_rename_table, surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
            new_table_name: "{{TblRenamed}}"
        then:
          error_code: 1

  # ──────────────────────────────────────────────────────────────────
  - operation: InsertIntoTable
    cases:
      - id: insert_append_succeeds_after_create
        description: |
          Appending an empty Arrow IPC stream into a freshly created
          table is a no-op write that must succeed.  This exercises the
          insert plumbing without depending on row-level data
          assertions, which are the responsibility of P4.6.
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
            mode: "append"
            request_data: empty
        then:
          status: ok

      - id: insert_into_nonexistent_table_must_404
        description: |
          InsertIntoTable against an unknown table must surface
          TableNotFound (4) before consuming the body.
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
            mode: "append"
            request_data: empty
        then:
          error_code: 4

      - id: insert_invalid_mode_must_400
        description: |
          InsertIntoTable with an unknown `mode` must return
          InvalidInput (13).  The implementation rejects the mode
          before checking table existence, so the case is set up
          against an empty catalog.
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
            mode: "bogus"
            request_data: empty
        then:
          error_code: 13

      - id: insert_into_table_namespace_not_found_must_404
        description: |
          See `ListTables.list_tables_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
            mode: "append"
            request_data: empty
        then:
          error_code: 1

      - id: insert_into_table_concurrent_modification_must_409
        description: |
          Concurrent inserts surface ConcurrentModification (14) on OCC
          backends.
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            mode: "append"
            request_data: empty
        then:
          error_code: 14

      - id: insert_into_table_invalid_state_must_409
        description: |
          InsertIntoTable against a table in an invalid state surfaces
          InvalidTableState (19).
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            mode: "append"
            request_data: empty
        then:
          error_code: 19

      - id: insert_into_table_invalid_schema_must_422
        description: |
          InsertIntoTable with an IPC body whose schema does not match
          the table's surfaces TableSchemaValidationError (20).
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            mode: "append"
            request_data: empty
        then:
          error_code: 20

  # ──────────────────────────────────────────────────────────────────
  - operation: CountTableRows
    cases:
      - id: count_after_create_returns_zero
        description: |
          A freshly created table backed by `Fixtures::arrow_ipc_empty`
          must report exactly zero rows.
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
        then:
          status: ok
          response_assertions:
            - kind: count_eq
              value: 0

      - id: count_nonexistent_table_must_404
        description: |
          CountTableRows on an unknown table must return
          TableNotFound (4).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
        then:
          error_code: 4

      - id: count_table_rows_namespace_not_found_must_404
        description: |
          See `ListTables.list_tables_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
        then:
          error_code: 1

      - id: count_table_rows_unknown_version_must_404
        description: |
          CountTableRows pointing at a missing version surfaces
          TableVersionNotFound (11). DirectoryNamespace surfaces this
          via the dataset loader; gated behind
          `enforces_optimistic_concurrency` because the exact code is
          implementation-specific.
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
            version: 999
        then:
          error_code: 11

  # ──────────────────────────────────────────────────────────────────
  - operation: RestoreTable
    cases:
      - id: restore_negative_version_must_400
        description: |
          RestoreTable with a negative `version` must short-circuit
          with InvalidInput (13) before any path resolution.
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            version: -1
        then:
          error_code: 13

      - id: restore_nonexistent_table_must_404
        description: |
          RestoreTable for an unknown table id must surface
          TableNotFound (4) at the path-resolution step.
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
            version: 0
        then:
          error_code: 4

      - id: restore_table_unknown_version_must_404
        description: |
          RestoreTable on a real table with a non-existent version
          surfaces TableVersionNotFound (11).
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
            version: 999
        then:
          error_code: 11

      - id: restore_table_concurrent_modification_must_409
        description: |
          Concurrent restore calls surface ConcurrentModification (14)
          on OCC backends.
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            version: 0
        then:
          error_code: 14

      - id: restore_table_namespace_not_found_must_404
        description: |
          See `ListTables.list_tables_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
            version: 0
        then:
          error_code: 1

  # ──────────────────────────────────────────────────────────────────
  - operation: UpdateTableSchemaMetadata
    cases:
      - id: update_schema_metadata_nonexistent_table_must_404
        description: |
          UpdateTableSchemaMetadata for an unknown table must return
          TableNotFound (4).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
            metadata:
              comment: "hello"
        then:
          error_code: 4

      - id: update_schema_metadata_after_create_succeeds
        description: |
          UpdateTableSchemaMetadata on a freshly created table with a
          single key/value pair must succeed.
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
