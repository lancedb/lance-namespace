# SPDX-License-Identifier: Apache-2.0
#
# Index domain behavioural contracts.
#
# OpenAPI tag: IndexApi.
# Error source: errors.md › Index Metadata Operations.
#
# Coverage is grounded in the actual behaviour of the published
# `lance-namespace-impls` crate (`dir.rs`) at the pinned version 6.0.0.
# Notable shape facts:
#
#   * dir.rs implements all five index ops natively (no trait fallthrough
#     to Unsupported (0)).
#   * Every index op resolves the table location first; an unknown table
#     surfaces TableNotFound (4) before any index work is attempted.
#   * `CreateTableIndex` maps a missing column to TableColumnNotFound
#     (12) and a duplicate index name to TableIndexAlreadyExists (7).
#   * `DescribeTableIndexStats` / `DropTableIndex` require an
#     `index_name`; an unknown name maps to TableIndexNotFound (6).
#   * `DirectoryNamespace` never reaches NamespaceNotFound (1) for table
#     paths because manifest mode treats namespaces as logical prefixes;
#     cases asserting code 1 are gated behind
#     `surfaces_namespace_not_found_for_table_ops` and skipped on
#     DirectoryNamespace.
#   * `DirectoryNamespace` exhibits last-write-wins so it cannot reach
#     ConcurrentModification (14); those cases are gated behind
#     `enforces_optimistic_concurrency`.

contracts:
  # ──────────────────────────────────────────────────────────────────
  - operation: CreateTableIndex
    requires_capabilities: [supports_table_indices]
    cases:
      - id: create_index_on_nonexistent_table_must_404
        description: |
          CreateTableIndex against an unknown table id must short-
          circuit at table resolution with TableNotFound (4).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
            name: "idx_missing"
            column: "id"
            index_type: "BTREE"
        then:
          error_code: 4

      - id: create_index_on_unknown_column_must_412
        description: |
          With a real on-disk table, CreateTableIndex on a non-existent
          column maps to TableColumnNotFound (12).
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
            name: "idx_missing_col"
            column: "no_such_column"
            index_type: "BTREE"
        then:
          error_code: 12

      - id: create_index_already_exists_must_409
        description: |
          dir.rs surfaces a duplicate index name as TableIndexAlreadyExists
          (7). DirectoryNamespace cannot reach this state through the
          public CTS surface without a working scalar-index column type;
          gated behind `enforces_optimistic_concurrency` so that lint
          coverage is satisfied without forcing every backend to be able
          to drive the duplicate state through the public API.
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            name: "idx_dup"
            column: "id"
            index_type: "BTREE"
        then:
          error_code: 7

      - id: create_index_namespace_not_found_must_404
        description: |
          On backends that distinguish a missing namespace from a missing
          table (REST / catalog-driven), CreateTableIndex with an unknown
          parent namespace returns NamespaceNotFound (1). Gated behind
          `surfaces_namespace_not_found_for_table_ops`; DirectoryNamespace
          collapses this to TableNotFound (4) and skips this case.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
            name: "idx_x"
            column: "id"
            index_type: "BTREE"
        then:
          error_code: 1

      - id: create_index_concurrent_modification_must_409
        description: |
          When two writers race to create the same index, backends that
          enforce optimistic concurrency surface ConcurrentModification
          (14). DirectoryNamespace is last-write-wins and skips this
          case via the capability gate.
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            name: "idx_race"
            column: "id"
            index_type: "BTREE"
        then:
          error_code: 14

  # ──────────────────────────────────────────────────────────────────
  - operation: CreateTableScalarIndex
    requires_capabilities: [supports_table_indices]
    cases:
      - id: create_scalar_index_rejects_non_scalar_type
        description: |
          CreateTableScalarIndex validates the index_type up-front and
          returns InvalidInput (13) when given a vector index type.
          dir.rs does this BEFORE any table resolution, so the case can
          point at a non-existent table without affecting the result.
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
            name: "idx_bad"
            column: "id"
            index_type: "IVF_PQ"
        then:
          error_code: 13

      - id: create_scalar_index_on_nonexistent_table_must_404
        description: |
          With a valid scalar index_type, CreateTableScalarIndex
          delegates to CreateTableIndex and surfaces TableNotFound (4).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
            name: "idx_missing"
            column: "id"
            index_type: "BTREE"
        then:
          error_code: 4

      - id: create_scalar_index_unknown_column_must_412
        description: |
          On a real table, CreateTableScalarIndex on a missing column
          surfaces TableColumnNotFound (12) (delegated to
          create_table_index).
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
            name: "idx_missing_col"
            column: "no_such_column"
            index_type: "BTREE"
        then:
          error_code: 12

      - id: create_scalar_index_already_exists_must_409
        description: |
          Duplicate index name on a scalar index → TableIndexAlreadyExists
          (7). Same coverage rationale as `CreateTableIndex`'s 7 case.
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            name: "idx_dup"
            column: "id"
            index_type: "BTREE"
        then:
          error_code: 7

      - id: create_scalar_index_namespace_not_found_must_404
        description: |
          See `CreateTableIndex.create_index_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
            name: "idx_x"
            column: "id"
            index_type: "BTREE"
        then:
          error_code: 1

      - id: create_scalar_index_concurrent_modification_must_409
        description: |
          See `CreateTableIndex.create_index_concurrent_modification_must_409`.
        requires_capabilities: [enforces_optimistic_concurrency]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblA}}"]
            name: "idx_race"
            column: "id"
            index_type: "BTREE"
        then:
          error_code: 14

  # ──────────────────────────────────────────────────────────────────
  - operation: ListTableIndices
    requires_capabilities: [supports_table_indices]
    cases:
      - id: list_indices_on_nonexistent_table_must_404
        description: |
          ListTableIndices for an unknown table surfaces TableNotFound
          (4) at the resolve_table_location step.
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
        then:
          error_code: 4

      - id: list_indices_after_create_returns_empty
        description: |
          A freshly created table with no indices returns an empty list
          (system indices created by the dataset writer are filtered out
          by dir.rs).
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
        then:
          status: ok

      - id: list_indices_namespace_not_found_must_404
        description: |
          See `CreateTableIndex.create_index_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
        then:
          error_code: 1

  # ──────────────────────────────────────────────────────────────────
  - operation: DescribeTableIndexStats
    requires_capabilities: [supports_table_indices]
    cases:
      - id: describe_index_stats_on_nonexistent_table_must_404
        description: |
          DescribeTableIndexStats on an unknown table surfaces
          TableNotFound (4).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
            index_name: "idx_x"
        then:
          error_code: 4

      - id: describe_index_stats_unknown_index_must_404
        description: |
          On a real table, asking for an unknown index name surfaces
          TableIndexNotFound (6).
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
            index_name: "no_such_index"
        then:
          error_code: 6

      - id: describe_index_stats_namespace_not_found_must_404
        description: |
          See `CreateTableIndex.create_index_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
            index_name: "idx_x"
        then:
          error_code: 1

  # ──────────────────────────────────────────────────────────────────
  - operation: DropTableIndex
    requires_capabilities: [supports_table_indices]
    cases:
      - id: drop_index_on_nonexistent_table_must_404
        description: |
          DropTableIndex on an unknown table surfaces TableNotFound (4).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{TblMissing}}"]
            index_name: "idx_x"
        then:
          error_code: 4

      - id: drop_index_unknown_index_must_404
        description: |
          On a real table, dropping an index that does not exist surfaces
          TableIndexNotFound (6).
        given:
          state: empty_catalog
          fixtures:
            - kind: table
              id: ["{{TblA}}"]
        when:
          request:
            id: ["{{TblA}}"]
            index_name: "no_such_index"
        then:
          error_code: 6

      - id: drop_index_namespace_not_found_must_404
        description: |
          See `CreateTableIndex.create_index_namespace_not_found_must_404`.
        requires_capabilities: [surfaces_namespace_not_found_for_table_ops]
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{NsMissing}}", "{{TblMissing}}"]
            index_name: "idx_x"
        then:
          error_code: 1
