# SPDX-License-Identifier: Apache-2.0
#
# Namespace domain behavioural contracts.
#
# OpenAPI tag: NamespaceApi
# Design doc: §3.5 of the maintainer's behavioural-contract design notes
#             (kept outside this repo)
#
# Coverage (driven by errors.md › Namespace Metadata Operations and the
# real behaviour of /opt/sourcecode/lance/rust/lance-namespace-impls/src/dir.rs):
#
#   CreateNamespace   —— error 2 (NamespaceAlreadyExists)
#   ListNamespaces    —— error 1 (NamespaceNotFound)
#   DescribeNamespace —— error 1 (NamespaceNotFound)
#   DropNamespace     —— errors 1, 3 (NamespaceNotEmpty)
#   NamespaceExists   —— error 1
#   ListTables        —— covered in table.yaml (per OpenAPI tag).

contracts:
  # ──────────────────────────────────────────────────────────────────
  - operation: CreateNamespace
    requires_capabilities: []
    cases:
      - id: create_root_must_fail
        description: |
          Creating the root namespace (id=[]) must fail because root
          always exists. dir.rs currently rejects with
          NamespaceAlreadyExists (2); the spec also allows
          implementations to reject with InvalidInput (13) on the
          grounds that root is not a valid path.
        given:
          state: empty_catalog
        when:
          request:
            id: []
            mode: create
        then:
          error_code: 2
          error_code_alternatives: [13]

      - id: create_existing_namespace_must_conflict
        description: |
          With mode=create, recreating a namespace at an already
          existing path must return NamespaceAlreadyExists (2).
        given:
          state: namespace_exists
          fixtures:
            - kind: namespace
              id: ["{{ns_a}}"]
        when:
          request:
            id: ["{{ns_a}}"]
            mode: create
        then:
          error_code: 2

      - id: create_then_describe_succeeds
        description: |
          Creating a non-existent namespace must succeed and the same
          namespace must subsequently be describable. This is review
          scenario #3.
        given:
          state: empty_catalog
        when:
          - op: CreateNamespace
            request:
              id: ["{{ns_a}}"]
              mode: create
            expect:
              status: ok
          - op: DescribeNamespace
            request:
              id: ["{{ns_a}}"]
            expect:
              status: ok

      - id: create_two_level_under_unknown_parent
        requires_capabilities: [supports_two_level_namespace_path]
        description: |
          When the parent of a two-level path does not exist, creating
          ["unknown", "child"] must return NamespaceNotFound (1).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{ns_unknown}}", "{{ns_child}}"]
            mode: create
        then:
          error_code: 1

  # ──────────────────────────────────────────────────────────────────
  - operation: DropNamespace
    cases:
      - id: drop_nonexistent_must_404
        description: Dropping a non-existent namespace must return NamespaceNotFound (1).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{ns_missing}}"]
        then:
          error_code: 1

      - id: drop_root_must_fail
        description: |
          Dropping the root namespace (id=[]) must fail. dir.rs
          currently rejects with InvalidInput (13) and the message
          "cannot be dropped"; the spec also accepts NamespaceNotEmpty
          (3) as an alternative.
        given:
          state: empty_catalog
        when:
          request:
            id: []
        then:
          error_code: 13
          error_code_alternatives: [3]

      - id: drop_then_namespace_exists_must_404
        description: |
          Dropping an existing namespace must succeed, and a subsequent
          NamespaceExists call must return NamespaceNotFound (1).
        given:
          state: namespace_exists
          fixtures:
            - kind: namespace
              id: ["{{ns_a}}"]
        when:
          - op: DropNamespace
            request:
              id: ["{{ns_a}}"]
            expect:
              status: ok
          - op: NamespaceExists
            request:
              id: ["{{ns_a}}"]
            expect:
              error_code: 1

      - id: drop_nonempty_restrict_must_409
        requires_capabilities: [supports_two_level_namespace_path]
        description: |
          With behavior=Restrict (the default), dropping a namespace
          that has child namespaces must return NamespaceNotEmpty (3).
        given:
          state: namespace_with_child
          fixtures:
            - kind: namespace
              id: ["{{ns_parent}}"]
            - kind: namespace
              id: ["{{ns_parent}}", "{{ns_child}}"]
        when:
          request:
            id: ["{{ns_parent}}"]
            behavior: restrict
        then:
          error_code: 3

      - id: drop_nonempty_cascade_succeeds
        requires_capabilities:
          - supports_two_level_namespace_path
          - supports_drop_namespace_cascade
        description: |
          With behavior=Cascade, dropping a namespace that has children
          must succeed and the children must disappear too.
        given:
          state: namespace_with_child
          fixtures:
            - kind: namespace
              id: ["{{ns_parent}}"]
            - kind: namespace
              id: ["{{ns_parent}}", "{{ns_child}}"]
        when:
          - op: DropNamespace
            request:
              id: ["{{ns_parent}}"]
              behavior: cascade
            expect:
              status: ok
          - op: NamespaceExists
            request:
              id: ["{{ns_parent}}"]
            expect:
              error_code: 1

  # ──────────────────────────────────────────────────────────────────
  - operation: DescribeNamespace
    cases:
      - id: describe_root_succeeds
        description: |
          Describing the root namespace must succeed because root always exists.
        given:
          state: empty_catalog
        when:
          request:
            id: []
        then:
          status: ok

      - id: describe_nonexistent_must_404
        description: Describing a non-existent namespace must return NamespaceNotFound (1).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{ns_missing}}"]
        then:
          error_code: 1

      - id: describe_existing_namespace_succeeds
        description: After CreateNamespace, DescribeNamespace must succeed for the same path.
        given:
          state: namespace_exists
          fixtures:
            - kind: namespace
              id: ["{{ns_a}}"]
        when:
          request:
            id: ["{{ns_a}}"]
        then:
          status: ok

  # ──────────────────────────────────────────────────────────────────
  - operation: NamespaceExists
    cases:
      - id: exists_root_succeeds
        description: NamespaceExists on the root namespace must succeed.
        given:
          state: empty_catalog
        when:
          request:
            id: []
        then:
          status: ok

      - id: exists_nonexistent_must_404
        description: NamespaceExists on a non-existent namespace must return NamespaceNotFound (1).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{ns_missing}}"]
        then:
          error_code: 1

      - id: exists_after_create_succeeds
        description: After CreateNamespace, NamespaceExists for the same path must succeed.
        given:
          state: namespace_exists
          fixtures:
            - kind: namespace
              id: ["{{ns_a}}"]
        when:
          request:
            id: ["{{ns_a}}"]
        then:
          status: ok

  # ──────────────────────────────────────────────────────────────────
  - operation: ListNamespaces
    cases:
      - id: list_root_on_empty_catalog
        description: |
          ListNamespaces(id=[]) on an empty catalog must return 200 with
          an empty list.
        given:
          state: empty_catalog
        when:
          request:
            id: []
        then:
          status: ok
          response_assertions:
            - kind: namespaces_count
              value: 0

      - id: list_root_after_two_creates
        description: |
          After creating two child namespaces under root,
          ListNamespaces(id=[]) must include both of them.
        given:
          state: empty_catalog
          fixtures:
            - kind: namespace
              id: ["{{ns_a}}"]
            - kind: namespace
              id: ["{{ns_b}}"]
        when:
          request:
            id: []
        then:
          status: ok
          response_assertions:
            - kind: namespaces_contains
              value: "{{ns_a}}"
            - kind: namespaces_contains
              value: "{{ns_b}}"

      - id: list_under_unknown_parent_must_404
        requires_capabilities: [supports_two_level_namespace_path]
        description: |
          ListNamespaces against a non-existent parent path must return
          NamespaceNotFound (1).
        given:
          state: empty_catalog
        when:
          request:
            id: ["{{ns_missing}}"]
        then:
          error_code: 1
